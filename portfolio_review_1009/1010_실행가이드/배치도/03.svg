<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>새 03 프로젝트 목차 편집 배치도</title><rect width="1920" height="1080" fill="#F7F8FA"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="120" y="66.0" font-size="23" font-weight="400" fill="#596579">편집 가이드 · 원본 03</text><text x="1530" y="66.0" font-size="23" font-weight="600" fill="#2D5BDB">새 03 / 26</text><text x="120" y="156.0" font-size="52" font-weight="700" fill="#18212B">업무 구조·모바일 흐름·구현 기준을 설계한 사례</text><rect x="120" y="315" width="1680" height="125" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="355.0" font-size="24" font-weight="650" fill="#2D5BDB">첫 번째 행</text><text x="148" y="402.0" font-size="24" font-weight="400" fill="#18212B">01 통합 관리 플랫폼 · 지도와 업무별 자료 탐색 / 04–10</text><rect x="120" y="460" width="1680" height="125" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="500.0" font-size="24" font-weight="650" fill="#2D5BDB">두 번째 행</text><text x="148" y="547.0" font-size="24" font-weight="400" fill="#18212B">02 TBM 현장 기록 · 수기 기록의 웹·모바일 전환 / 11–15</text><rect x="120" y="605" width="1680" height="125" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="645.0" font-size="24" font-weight="650" fill="#2D5BDB">세 번째 행</text><text x="148" y="692.0" font-size="24" font-weight="400" fill="#18212B">03 ERP 대시보드 · 비용·인원 비교와 구현 기준 / 16–19</text><rect x="120" y="750" width="1680" height="125" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="790.0" font-size="24" font-weight="650" fill="#2D5BDB">네 번째 행</text><text x="148" y="837.0" font-size="24" font-weight="400" fill="#18212B">04 공통 UI 기준 · 컬러 토큰·SCSS·UI 요소 재사용 / 20–23</text><text x="120" y="967.0" font-size="26" font-weight="400" fill="#596579">미배포 모바일 인트라넷 24 · 개인 칸반 프로토타입 25 · 연락처 26</text><text x="120" y="1042.0" font-size="22" font-weight="400" fill="#596579">편집용 배치 예시 · 실제 제출 전 원본 UI 수정과 사실 확인 필요</text></g></svg>