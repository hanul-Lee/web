<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>새 10 플랫폼: 결과와 협업 편집 배치도</title><rect width="1920" height="1080" fill="#F7F8FA"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="120" y="66.0" font-size="23" font-weight="400" fill="#596579">편집 가이드 · 원본 28 + 19·26 담당 정보 → 새 10</text><text x="1530" y="66.0" font-size="23" font-weight="600" fill="#2D5BDB">새 10 / 26</text><text x="120" y="156.0" font-size="52" font-weight="700" fill="#18212B">UI·퍼블리싱을 담당한 통합 플랫폼이 배포되어 실제 사용자가 사용</text><text x="120" y="234.0" font-size="52" font-weight="700" fill="#18212B">했습니다.</text><rect x="120" y="350" width="540" height="500" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="390.0" font-size="24" font-weight="650" fill="#2D5BDB">좌측 산출물</text><text x="148" y="454.0" font-size="28" font-weight="400" fill="#18212B">공통 메뉴의 업무별 자료 분류</text><text x="148" y="496.0" font-size="28" font-weight="400" fill="#18212B">지도와 관련 정보의 탐색 UI</text><text x="148" y="538.0" font-size="28" font-weight="400" fill="#18212B">HTML·CSS·SCSS 퍼블리싱</text><rect x="690" y="350" width="540" height="500" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="714" y="390.0" font-size="24" font-weight="650" fill="#2D5BDB">중앙 활용 범위</text><text x="718" y="454.0" font-size="28" font-weight="400" fill="#18212B">배포 후 실제 사용자 사용</text><text x="718" y="496.0" font-size="28" font-weight="400" fill="#18212B">프로젝트 시연·내부 커뮤니케이션에</text><text x="718" y="538.0" font-size="28" font-weight="400" fill="#18212B">도 산출물 활용</text><rect x="1260" y="350" width="540" height="500" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="1284" y="390.0" font-size="24" font-weight="650" fill="#2D5BDB">우측 협업</text><text x="1288" y="454.0" font-size="28" font-weight="400" fill="#18212B">관련 직군과 정보 범위·UI 기준 조</text><text x="1288" y="496.0" font-size="28" font-weight="400" fill="#18212B">율</text><text x="120" y="930.0" font-size="26" font-weight="400" fill="#596579">참여 과제 종합 평가: 85.6점. UI 단독 평가 점수는 아닙니다.</text><text x="120" y="1042.0" font-size="22" font-weight="400" fill="#596579">편집용 배치 예시 · 실제 제출 전 원본 UI 수정과 사실 확인 필요</text></g></svg>