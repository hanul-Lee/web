<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>새 05 플랫폼: 문제와 사용자 목적 편집 배치도</title><rect width="1920" height="1080" fill="#F7F8FA"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="120" y="66.0" font-size="23" font-weight="400" fill="#596579">편집 가이드 · 원본 20 + 21 → 새 05</text><text x="1530" y="66.0" font-size="23" font-weight="600" fill="#2D5BDB">새 05 / 26</text><text x="120" y="156.0" font-size="52" font-weight="700" fill="#18212B">같은 현장 자료도 사용자마다 확인 목적이 달랐습니다.</text><rect x="120" y="350" width="800" height="485" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="390.0" font-size="24" font-weight="650" fill="#2D5BDB">좌측 기존 업무</text><text x="148" y="454.0" font-size="28" font-weight="400" fill="#18212B">공정·자원·보상·현장 자료가 문서·파일·프로그램에 나뉘</text><text x="148" y="496.0" font-size="28" font-weight="400" fill="#18212B">어 있어 관련 자료를 각각 찾아야 했습니다.</text><rect x="960" y="350" width="840" height="485" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="984" y="390.0" font-size="24" font-weight="650" fill="#2D5BDB">우측 3행 표</text><text x="988" y="454.0" font-size="28" font-weight="400" fill="#18212B">현장 관리자 | 공정·현장 위치 관련 정보</text><text x="988" y="496.0" font-size="28" font-weight="400" fill="#18212B">본사 담당자 | 공정·자원·보상 관리 현황</text><text x="988" y="538.0" font-size="28" font-weight="400" fill="#18212B">외부 이해관계자 | 프로젝트 현황·시각화 자료</text><rect x="120" y="860" width="1680" height="135" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="900.0" font-size="24" font-weight="650" fill="#2D5BDB">하단 설명 / 추가 모듈</text><text x="148" y="947.0" font-size="24" font-weight="400" fill="#18212B">설계 과제: 업무별 자료를 공통 메뉴에 묶고 지도와 관련 정보를 이어서 확인하는 구조</text><text x="120" y="1042.0" font-size="22" font-weight="400" fill="#596579">편집용 배치 예시 · 실제 제출 전 원본 UI 수정과 사실 확인 필요</text></g></svg>