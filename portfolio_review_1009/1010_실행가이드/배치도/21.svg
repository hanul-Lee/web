<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>새 21 공통 UI 기준: 컬러 토큰·SCSS 편집 배치도</title><rect width="1920" height="1080" fill="#F7F8FA"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="120" y="66.0" font-size="23" font-weight="400" fill="#596579">편집 가이드 · 본인 설명의 실제 재사용 방식 + 웹 Foundation → 새 21</text><text x="1530" y="66.0" font-size="23" font-weight="600" fill="#2D5BDB">새 21 / 26</text><text x="120" y="156.0" font-size="52" font-weight="700" fill="#18212B">컬러를 토큰으로 관리하고 프로젝트별 SCSS에서 재사용했습니다.</text><rect x="120" y="350" width="800" height="485" rx="16" fill="#FFFFFF" stroke="#2D5BDB" stroke-width="2" stroke-dasharray="12 8"/><text x="144" y="395.0" font-size="24" font-weight="650" fill="#2D5BDB">좌측 실제 토큰</text><text x="160" y="500.0" font-size="32" font-weight="400" fill="#18212B">컬러 토큰 정의: 실제 SCSS 파일에서 발췌</text><text x="160" y="720.0" font-size="27" font-weight="400" fill="#2D5BDB">실제 업무 원본을 가져올 자리</text><rect x="960" y="350" width="840" height="485" rx="16" fill="#FFFFFF" stroke="#2D5BDB" stroke-width="2" stroke-dasharray="12 8"/><text x="984" y="395.0" font-size="24" font-weight="650" fill="#2D5BDB">우측 실제 적용</text><text x="1000" y="500.0" font-size="32" font-weight="400" fill="#18212B">토큰 적용: 실제 프로젝트 SCSS와 해당 UI</text><text x="1000" y="720.0" font-size="27" font-weight="400" fill="#2D5BDB">실제 적용 코드·화면을 가져올 자리</text><rect x="120" y="860" width="1680" height="135" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="900.0" font-size="24" font-weight="650" fill="#2D5BDB">하단 설명 / 추가 모듈</text><text x="148" y="947.0" font-size="24" font-weight="400" fill="#18212B">컬러 기준 → SCSS 토큰 정의 → 프로젝트 스타일 → 적용 UI / 디자이너가 프론트 작업에 반복 사용한 공통 컬러 기준</text><text x="120" y="1042.0" font-size="22" font-weight="400" fill="#596579">편집용 배치 예시 · 실제 제출 전 원본 UI 수정과 사실 확인 필요</text></g></svg>