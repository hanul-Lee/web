<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>새 22 공통 UI 기준: 요소 재사용 편집 배치도</title><rect width="1920" height="1080" fill="#F7F8FA"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="120" y="66.0" font-size="23" font-weight="400" fill="#596579">편집 가이드 · 본인 설명 + 웹 Component 자료 → 새 22</text><text x="1530" y="66.0" font-size="23" font-weight="600" fill="#2D5BDB">새 22 / 26</text><text x="120" y="156.0" font-size="52" font-weight="700" fill="#18212B">입력·라디오·체크박스는 화면에 맞춰 크기를 조정해 사용했습니다.</text><rect x="120" y="350" width="800" height="485" rx="16" fill="#FFFFFF" stroke="#2D5BDB" stroke-width="2" stroke-dasharray="12 8"/><text x="144" y="395.0" font-size="24" font-weight="650" fill="#2D5BDB">좌측 공통 요소</text><text x="160" y="500.0" font-size="32" font-weight="400" fill="#18212B">공통 UI 요소: 입력 / 라디오 / 체크박스</text><text x="160" y="720.0" font-size="27" font-weight="400" fill="#2D5BDB">실제 업무 원본을 가져올 자리</text><rect x="960" y="350" width="840" height="485" rx="16" fill="#FFFFFF" stroke="#2D5BDB" stroke-width="2" stroke-dasharray="12 8"/><text x="984" y="395.0" font-size="24" font-weight="650" fill="#2D5BDB">우측 실제 적용</text><text x="1000" y="500.0" font-size="32" font-weight="400" fill="#18212B">프로젝트 적용: 기본 요소를 화면 요구에 맞게</text><text x="1000" y="548.0" font-size="32" font-weight="400" fill="#18212B"> 크기 조정</text><text x="1000" y="720.0" font-size="27" font-weight="400" fill="#2D5BDB">실제 적용 코드·화면을 가져올 자리</text><rect x="120" y="860" width="1680" height="135" rx="16" fill="#FFFFFF" stroke="#CBD4E1" stroke-width="2"/><text x="144" y="900.0" font-size="24" font-weight="650" fill="#2D5BDB">하단 설명 / 추가 모듈</text><text x="148" y="947.0" font-size="24" font-weight="400" fill="#18212B">컬러는 반복 재사용, 일부 UI 요소는 크기를 조정해 사용 / 크기 조정의 실제 이유와 조정 항목은 당시 적용 자료로 확인 후 추가</text><text x="120" y="1042.0" font-size="22" font-weight="400" fill="#596579">편집용 배치 예시 · 실제 제출 전 원본 UI 수정과 사실 확인 필요</text></g></svg>