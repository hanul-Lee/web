name: Portfolio checks and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHROME_PATH: /usr/bin/google-chrome
      FONT_PYTHON: ${{ runner.temp }}/portfolio-fonts/bin/python
      AUDIT_REPORT: ${{ runner.temp }}/portfolio-browser-audit.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install build and browser dependencies
        run: |
          npm ci --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/portfolio-fonts"
          "$FONT_PYTHON" -m pip install -r scripts/font-requirements.txt
          npx playwright install --with-deps chromium webkit firefox
      - name: Audit locked dependencies
        run: |
          npm audit --audit-level=high
          python3 -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install pip-audit==2.9.0
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip_audit -r scripts/font-requirements.txt --no-deps --disable-pip
      - name: Build dist only
        run: npm run build
      - name: Verify deterministic output and clean sources
        run: |
          npm run check:build
          git diff --exit-code
      - name: Validate content, assets, fonts and protected styles
        run: npm test
      - name: Check public files, preview server and browser security
        run: npm run test:security
      - name: Test static pages and responsive layout
        run: |
          npm run test:static
          npm run test:layout
      - name: Test overlap detection, image viewer and keyboard flow
        run: |
          npm run test:overlap
          npm run test:viewer
          npm run test:flow
      - name: Audit all three browser engines
        run: npm run test:browsers
      - name: Upload verified public files only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified dist artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
