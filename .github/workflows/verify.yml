name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
      FONT_PYTHON: ${{ runner.temp }}/portfolio-fonts/bin/python
      AUDIT_REPORT: ${{ runner.temp }}/section-spacing-validation.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/portfolio-fonts"
          "$FONT_PYTHON" -m pip install -r tools/font-requirements.txt
      - name: Build pages, styles and font subsets
        run: npm run build
      - name: Validate content, assets and performance rules
        run: npm test
      - name: Test static pages and image interactions
        run: npm run test:static
      - name: Check all pages at 15 screen widths
        run: npm run test:layout
      - name: Verify generated files were committed
        run: |
          git diff --exit-code -- index.html 'project-*.html' 404.html robots.txt sitemap.xml shared.css shared.css.map portfolio.css portfolio.css.map assets/fonts/fonts.css assets/fonts/subset tools/font-manifest.json
          test -z "$(git ls-files --others --exclude-standard assets/fonts/subset)"
