<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img"><title>회의실 예약과 근태 신청의 모바일 흐름</title><rect width="1000" height="530" rx="18" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#202c3d"><text x="42" y="62" font-size="28" font-weight="700">회의실 예약과 근태 신청의 모바일 흐름</text><rect x="42" y="104" width="292" height="325" rx="14" fill="white" stroke="#d9e1eb"/><text x="62" y="148" font-size="21" font-weight="700">회의실 예약</text><text x="62" y="199" font-size="17">공간 현황 확인</text><text x="62" y="244" font-size="17">예약일·시간 입력</text><text x="62" y="289" font-size="17">목적·사유 입력</text><rect x="352" y="104" width="292" height="325" rx="14" fill="white" stroke="#d9e1eb"/><text x="372" y="148" font-size="21" font-weight="700">근태 신청</text><text x="372" y="199" font-size="17">문서 상태 확인</text><text x="372" y="244" font-size="17">근태 종류·일자 선택</text><text x="372" y="289" font-size="17">사유·결재선 입력</text><rect x="662" y="104" width="292" height="325" rx="14" fill="white" stroke="#d9e1eb"/><text x="682" y="148" font-size="21" font-weight="700">담당과 상태</text><text x="682" y="199" font-size="17">디자이너 팀에서 참여</text><text x="682" y="244" font-size="17">기획 · UI · 퍼블리싱</text><text x="682" y="289" font-size="17">미배포 · 팀 내부 확인</text><text x="42" y="480" font-size="16" fill="#59687b">1011 24쪽의 흐름 재구성 · 본인 참여 범위와 팀 결과를 함께 표기</text></g></svg>