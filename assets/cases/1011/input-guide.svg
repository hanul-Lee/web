<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>공통 입력 UI의 상태와 스타일</title><rect width="1100" height="650" rx="20" fill="#f4f6fa"/><g font-family="Arial, sans-serif" fill="#202c3d"><text x="36" y="52" font-size="28" fill="#202c3d" font-weight="700">공통 입력 UI의 상태와 스타일</text><rect x="36" y="96" width="485" height="478" rx="10" fill="white" stroke="#dce3ed"/><rect x="546" y="96" width="518" height="478" rx="10" fill="white" stroke="#dce3ed"/><text x="61" y="138" font-size="22" fill="#202c3d" font-weight="700">기본 입력과 라벨 입력</text><text x="62" y="180" font-size="16" fill="#627189" font-weight="400">기본</text><rect x="62" y="193" width="430" height="44" rx="4" fill="white" stroke="#dce3ed"/><text x="77" y="222" font-size="18" fill="#9aa3b0" font-weight="400">내용을 입력해 주세요.</text><text x="62" y="269" font-size="16" fill="#627189" font-weight="400">포커스</text><rect x="62" y="282" width="430" height="44" rx="4" fill="white" stroke="#1e554d"/><text x="77" y="311" font-size="18" fill="#9aa3b0" font-weight="400">│</text><text x="62" y="358" font-size="16" fill="#627189" font-weight="400">입력 중</text><rect x="62" y="371" width="430" height="44" rx="4" fill="white" stroke="#1e554d"/><text x="77" y="400" font-size="18" fill="#9aa3b0" font-weight="400">작성 내용</text><text x="62" y="447" font-size="16" fill="#627189" font-weight="400">비활성</text><rect x="62" y="460" width="430" height="44" rx="4" fill="#f1f2f4" stroke="#dce3ed"/><text x="77" y="489" font-size="18" fill="#9aa3b0" font-weight="400">내용을 입력해 주세요.</text><text x="572" y="138" font-size="22" fill="#202c3d" font-weight="700">테이블·목록 안의 스타일</text><text x="573" y="184" font-size="18" fill="#202c3d" font-weight="700">읽기 전용</text><rect x="573" y="200" width="462" height="117" rx="10" fill="#f9fafc" stroke="#dce3ed"/><text x="590" y="239" font-size="18" fill="#1e554d" font-weight="400">input / textarea</text><text x="590" y="273" font-size="18" fill="#627189" font-weight="400">값 확인 · 배경과 테두리 정리</text><text x="573" y="365" font-size="18" fill="#202c3d" font-weight="700">편집 상태</text><rect x="573" y="381" width="462" height="117" rx="10" fill="#f9fafc" stroke="#dce3ed"/><rect x="589" y="399" width="430" height="46" rx="4" fill="white" stroke="#c7d1dd"/><text x="607" y="430" font-size="18" fill="#627189" font-weight="400">수정할 내용을 입력합니다.</text><text x="590" y="480" font-size="18" fill="#627189" font-weight="400">입력 영역을 테두리로 구분</text><text x="36" y="626" font-size="17" fill="#627189" font-weight="400">가이드 설명도 · 1011 22쪽 재구성 · 실제 크기 조정 전후 화면은 아님</text></g></svg>