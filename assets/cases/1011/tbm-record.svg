<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>모바일 일지의 작성 맥락과 확인 상태</title><rect width="1100" height="650" rx="20" fill="#f4f6fa"/><g font-family="Arial, sans-serif" fill="#202c3d"><text x="36" y="52" font-size="28" fill="#202c3d" font-weight="700">작성 맥락 · 확인 상태 · 작성 진입</text><rect x="71" y="87" width="337" height="494" rx="24" fill="white" stroke="#c9d0da"/><text x="225" y="129" font-size="23" fill="#202c3d" font-weight="700">TBM</text><text x="96" y="179" font-size="19" fill="#202c3d" font-weight="400">작성일</text><rect x="240" y="151" width="142" height="41" rx="10" fill="#f5f6fa" stroke="#dce3ed"/><text x="257" y="179" font-size="17" fill="#627189" font-weight="400">날짜 선택</text><text x="96" y="232" font-size="19" fill="#202c3d" font-weight="400">금일 출역 인원</text><rect x="283" y="204" width="99" height="41" rx="10" fill="#f5f6fa" stroke="#dce3ed"/><text x="300" y="232" font-size="16" fill="#627189" font-weight="400">인원 확인</text><text x="96" y="282" font-size="19" fill="#202c3d" font-weight="400">결재자</text><rect x="96" y="297" width="139" height="98" rx="10" fill="#f5f6fa" stroke="#dce3ed"/><rect x="246" y="297" width="139" height="98" rx="10" fill="#f5f6fa" stroke="#dce3ed"/><text x="116" y="328" font-size="16" fill="#202c3d" font-weight="400">담당</text><text x="268" y="328" font-size="16" fill="#202c3d" font-weight="400">소장</text><rect x="110" y="346" width="110" height="31" rx="4" fill="#6b441e" stroke="#6b441e"/><text x="129" y="368" font-size="16" fill="white" font-weight="400">확인 완료</text><rect x="260" y="346" width="110" height="31" rx="4" fill="#ff972d" stroke="#ff972d"/><text x="294" y="368" font-size="16" fill="white" font-weight="400">확인</text><text x="96" y="433" font-size="18" fill="#202c3d" font-weight="400">근로자 확인 사항</text><rect x="96" y="451" width="139" height="38" rx="4" fill="#5367ff" stroke="#5367ff"/><text x="146" y="477" font-size="17" fill="white" font-weight="400">적합</text><rect x="246" y="451" width="139" height="38" rx="10" fill="white" stroke="#dce3ed"/><text x="286" y="477" font-size="17" fill="#202c3d" font-weight="400">부적합</text><rect x="96" y="508" width="289" height="48" rx="4" fill="#5367ff" stroke="#5367ff"/><text x="190" y="539" font-size="18" fill="white" font-weight="400">작성하기</text><rect x="455" y="125" width="608" height="117" rx="10" fill="white" stroke="#dce3ed"/><text x="483" y="168" font-size="22" fill="#202c3d" font-weight="700">1 · 작성 맥락</text><text x="483" y="207" font-size="20" fill="#627189" font-weight="400">작성일과 금일 출역 인원 확인</text><rect x="455" y="270" width="608" height="117" rx="10" fill="white" stroke="#dce3ed"/><text x="483" y="313" font-size="22" fill="#202c3d" font-weight="700">2 · 확인 상태</text><text x="483" y="352" font-size="20" fill="#627189" font-weight="400">담당·소장의 확인 표시와 액션</text><rect x="455" y="415" width="608" height="117" rx="10" fill="white" stroke="#dce3ed"/><text x="483" y="458" font-size="22" fill="#202c3d" font-weight="700">3 · 작성 진입</text><text x="483" y="497" font-size="20" fill="#627189" font-weight="400">근로자 확인 항목과 작성하기 버튼</text><text x="36" y="626" font-size="17" fill="#627189" font-weight="400">모바일 UI 설명도 · 1011 13쪽 재구성 · 원본 날짜는 검토 문서에서 별도 확인</text></g></svg>