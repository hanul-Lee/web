<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>칸반 작업 생성 입력 항목</title><rect width="1100" height="650" rx="20" fill="#f4f6fa"/><g font-family="Arial, sans-serif" fill="#202c3d"><text x="36" y="52" font-size="28" fill="#202c3d" font-weight="700">작업 생성 · 개인 UX/UI와 AI 보조 구현</text><rect x="62" y="95" width="548" height="487" rx="14" fill="#15191f" stroke="#15191f"/><text x="86" y="136" font-size="24" fill="white" font-weight="700">작업 추가</text><text x="88" y="172" font-size="16" fill="#c0c9d7" font-weight="400">작업 제목</text><rect x="88" y="185" width="497" height="44" rx="5" fill="#222831" stroke="#39404c"/><text x="106" y="214" font-size="17" fill="#8795a9" font-weight="400">제목 입력</text><text x="88" y="263" font-size="16" fill="#c0c9d7" font-weight="400">작업 설명</text><rect x="88" y="276" width="497" height="44" rx="5" fill="#222831" stroke="#39404c"/><text x="106" y="305" font-size="17" fill="#8795a9" font-weight="400">설명 입력</text><text x="88" y="354" font-size="16" fill="#c0c9d7" font-weight="400">담당자 · 상태</text><rect x="88" y="367" width="497" height="44" rx="5" fill="#222831" stroke="#39404c"/><text x="106" y="396" font-size="17" fill="#8795a9" font-weight="400">담당자와 상태 선택</text><text x="88" y="445" font-size="16" fill="#c0c9d7" font-weight="400">일정</text><rect x="88" y="458" width="497" height="44" rx="5" fill="#222831" stroke="#39404c"/><text x="106" y="487" font-size="17" fill="#8795a9" font-weight="400">시작일 · 종료일</text><rect x="460" y="541" width="125" height="27" rx="4" fill="#e57518" stroke="#e57518"/><text x="505" y="562" font-size="16" fill="white" font-weight="400">저장</text><rect x="643" y="106" width="422" height="131" rx="10" fill="white" stroke="#dce3ed"/><text x="668" y="152" font-size="22" fill="#202c3d" font-weight="700">이미지·제목 카드</text><text x="668" y="196" font-size="18" fill="#627189" font-weight="400">이미지와 제목으로 작업을 구분</text><rect x="643" y="260" width="422" height="131" rx="10" fill="white" stroke="#dce3ed"/><text x="668" y="306" font-size="22" fill="#202c3d" font-weight="700">카드 이동</text><text x="668" y="350" font-size="18" fill="#627189" font-weight="400">AI의 도움을 받아 인터랙션 구현</text><rect x="643" y="414" width="422" height="131" rx="10" fill="white" stroke="#dce3ed"/><text x="668" y="460" font-size="22" fill="#202c3d" font-weight="700">개인 프로토타입</text><text x="668" y="504" font-size="18" fill="#627189" font-weight="400">실제 사용자 평가 미실시</text><text x="36" y="626" font-size="17" fill="#627189" font-weight="400">작업 생성 항목 설명도 · 1011 25쪽 재구성 · 실제 앱 시연 캡처는 아님</text></g></svg>